[package]
name = "terminput-egui"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "egui adapter for terminput"
include.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "./README.md"

[dependencies]
egui_0_35 = { package = "egui", version = "0.35", default-features = false, optional = true }
egui_0_36 = { package = "egui", version = "0.36", default-features = false, optional = true }
egui_0_37 = { package = "egui", version = "0.37", default-features = false, optional = true }
terminput = { path = "../terminput", version = "0.5.16" }

[features]
egui_0_35 = ["dep:egui_0_35"]
egui_0_36 = ["dep:egui_0_36"]
egui_0_37 = ["dep:egui_0_37"]
default = ["egui_0_37"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
